{% extends "store/base.html" %}
{% block title %}Login | The Crochet Bloom{% endblock %}
{% block content %}<section class="section"><div class="container"><div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Login</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}<label>Username</label>{{ form.username }}<label class="mt-3">Password</label>{{ form.password }}<button class="btn btn-pink btn-lg w-100 mt-4">Login</button></form><p class="mt-3 text-center">New customer? <a href="{% url 'signup' %}">Create an account</a></p></div></div></section>{% endblock %}
